name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
    branches: [publish/pypi]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        default: testpypi
        options: [testpypi, pypi]
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Verify no telescope configs are bundled
        run: |
          if python -m zipfile -l dist/*.whl | grep -qiE 'configs/|\.yaml'; then
            echo "::error::Wheel contains config/YAML data files; see MANIFEST.in and [tool.setuptools]" && exit 1
          fi
          if tar tzf dist/*.tar.gz | grep -qiE '/configs/|\.yaml$'; then
            echo "::error::sdist contains config/YAML data files; see MANIFEST.in" && exit 1
          fi
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -c "
          import iactrace
          from iactrace.telescope import Telescope
          from iactrace.camera import Camera
          print('imported iactrace', iactrace.__version__)"
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(ls dist/*.tar.gz | sed -E 's/.*iactrace-(.*)\.tar\.gz/\1/')
          test "$tag" = "$pkg" || { echo "::error::tag $tag != version $pkg" && exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Manual rehearsal runs default to TestPyPI. Tag pushes always go to the real index.
  publish-testpypi:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.target != 'pypi' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/iactrace
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # Real PyPI is reachable only from a v* tag
  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.target == 'pypi' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/iactrace
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1